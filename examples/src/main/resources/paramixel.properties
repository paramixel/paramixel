# Paramixel configuration for the examples module.
#
# The root pool (paramixel.parallelism) bounds the top-level Parallel that Paramixel builds when it discovers
# the examples. It defaults to the number of available processors, so it is left unset here.
#
# Every other Parallel names a pool, and a pool must be defined. A pool is a run-wide limit: at most this many
# children of all Parallel actions that name the pool are alive at once. A pool that is used but missing
# fails the run; a pool that is defined but unused is simply ignored.

# General-purpose examples.
paramixel.parallelism.examples=4

# Examples that run test methods or arguments in parallel.
paramixel.parallelism.methods=4

# Every example that starts Testcontainers shares this pool, so only as many environments as the JVM reports
# cores (paramixel.parallelism.environments=@cores) are started at a time. @cores, @cores*N and @cores/N resolve
# against the processors the JVM reports and are never less than 1.
paramixel.parallelism.environments=@cores

# NestedParallelDeadlockTest: three nested levels need three different pools.
paramixel.parallelism.outer=2
paramixel.parallelism.middle=2
paramixel.parallelism.inner=2

# IsolatedTest: groups of tests, and the tests inside each group.
paramixel.parallelism.groups=4
paramixel.parallelism.group-tests=2

# MetricsTest: the fixture-per-environment example holds at most this many environment fixtures at once.
paramixel.parallelism.docker=2
